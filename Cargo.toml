[package]
name = "knack"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
gpui-kit = { version = "0.11.0", features = ["syntect"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.4.0"

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3.27.0"

[profile.release]
strip = "symbols"
